# nginx serving the React SPA and proxying the API.
#
# - Hashed build assets are cached hard (1y, immutable): Vite fingerprints
#   filenames, so a new deploy = new names, no stale-cache problems.
# - index.html is never cached, so clients always pick up the latest asset names.
# - /api is proxied to the Django service so the browser talks to one origin
#   (no CORS in production). At real scale you'd instead point the SPA at an API
#   gateway / put this behind a CDN.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (baseline; tune CSP per app).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm text/xml application/xml image/svg+xml font/woff2;

    # Container liveness probe target.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Fingerprinted assets — cache aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The production module's generated plate images / Excel. Django only serves
    # MEDIA_URL when DEBUG, so nginx serves it straight off the shared media
    # volume (compose: media_data). The Celery worker writes these files; this
    # container only reads them.
    location /media/ {
        alias /srv/media/;
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
        try_files $uri =404;
    }

    # The SAME files under the /api prefix. The SPA asks for plate images as
    # /api/media/... on purpose (see react-frontend/src/lib/media.ts): a
    # deployment that proxies only /api would otherwise answer /media/... from
    # its SPA fallback and every image would render as index.html.
    #
    # This block must come BEFORE `location /api/`, or the proxy rule below wins
    # and every plate image is served by a PYTHON worker through
    # django.views.static.serve. That is the slow path by a wide margin: a job
    # writes ~16 MB of PNGs, and each one would occupy a gunicorn thread for the
    # whole transfer instead of being sent by nginx with sendfile. Serving them
    # here keeps the API threads for API work.
    #
    # Django keeps its own /api/media/ route registered as the fallback for
    # deployments with nothing in front of MEDIA_ROOT; this simply gets there
    # first when nginx is present.
    location /api/media/ {
        alias /srv/media/;
        expires 1h;
        add_header Cache-Control "private, max-age=3600";
        try_files $uri =404;
    }

    # Proxy API calls to the Django backend (compose service name: api).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback — let the React app handle client-side routes.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
